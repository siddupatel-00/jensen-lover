<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jensen</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      cursor: crosshair;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #video {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }
    #audio {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Video muted so frame decoding never pauses -->
  <video id="video" src="jensen-video-hd.mp4" autoplay loop muted playsinline webkit-playsinline></video>
  
  <!-- Song plays automatically on loop -->
  <audio id="audio" src="song_from_20s.mp3" autoplay loop preload="auto"></audio>
  
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const audio = document.getElementById('audio');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    audio.muted = false;
    audio.volume = 1.0;

    function playMedia() {
      if (video.paused) {
        video.play().catch(() => {});
      }
      if (audio.paused) {
        audio.play().catch(() => {});
      }
    }

    // Play automatically on load
    playMedia();
    window.addEventListener('DOMContentLoaded', playMedia);
    window.addEventListener('load', playMedia);

    // Also trigger on any movement/interaction seamlessly without any UI
    const events = ['pointermove', 'mousemove', 'wheel', 'scroll', 'pointerdown', 'keydown', 'touchstart'];
    events.forEach(evt => window.addEventListener(evt, playMedia, { passive: true }));

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
    }
    window.addEventListener('resize', resize);
    resize();

    window.addEventListener('pointermove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function draw() {
      requestAnimationFrame(draw);

      if (video.paused) {
        video.play().catch(() => {});
      }

      if (video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
        return;
      }

      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;

      // vercel.vercel.vercel.app dynamic resizing
      const vmin = Math.min(w, h);
      const safeMouseY = Math.max(8, mouseY || (h / 2));
      const tileWidth = Math.min(Math.max(8, safeMouseY), vmin);
      const scale = tileWidth / video.videoWidth;
      const tileHeight = video.videoHeight * scale;

      const offsetX = mouseX || (w / 2);
      const offsetY = (h - tileHeight) * 0.5;

      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const pattern = ctx.createPattern(video, 'repeat');
      if (pattern) {
        const matrix = new DOMMatrix()
          .translateSelf(offsetX, offsetY)
          .scaleSelf(scale, scale);
        pattern.setTransform(matrix);
        ctx.fillStyle = pattern;
        ctx.fillRect(0, 0, w, h);
      }

      ctx.restore();
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
